<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColdMonitor - Login</title>
    
    <!-- Fonte Google e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- CSS -->
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <!-- Logo do Sistema -->
            <div class="logo">
                <i class="ph ph-thermometer-snow"></i>
                <span>ColdMonitor</span>
            </div>
            
            <h2>Acessar o Sistema</h2>
            <p class="subtitle">Insira suas credenciais para monitorar as câmaras</p>

            <!-- Formulário de Login -->
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="admin@coldmonitor.com" required>
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Entrar</button>
            </form>
        </div>
    </div>

    <!-- Script de Autenticação -->
    <script src="../assets/js/login.js"></script>
</body>
</html>
